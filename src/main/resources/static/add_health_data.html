<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logging Data - HealthGuard Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css?v=1.1">
</head>
<body style="padding-top: 72px">
    <div id="header-placeholder"></div>

    <div class="platform-layout">
        <!-- Sidebar -->
        <aside class="sidebar d-none d-lg-flex">
            <nav>
                <a href="dashboard.html" class="sidebar-nav-link"><i class="fa-solid fa-home"></i> Overview</a>
                <a href="add_health_data.html" class="sidebar-nav-link active"><i class="fa-solid fa-plus-circle"></i> Add Vitals</a>
                <a href="records.html" class="sidebar-nav-link"><i class="fa-solid fa-history"></i> History</a>
                <a href="alerts.html" class="sidebar-nav-link"><i class="fa-solid fa-bell"></i> Alerts</a>
                <hr>
                <a href="profile.html" class="sidebar-nav-link"><i class="fa-solid fa-user-gear"></i> Settings</a>
            </nav>
        </aside>

        <!-- Content Area -->
        <main class="content-area">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="mb-5 text-center">
                        <h1 class="fw-bold text-primary mb-2">Record New Health Vitals</h1>
                        <p class="text-muted">Fill in the current data from your health sensors below.</p>
                    </div>

                    <div class="card p-5 border-0 shadow-sm">
                        <form id="health-form" onsubmit="saveHealthData(event)">
                            <div class="row g-4">
                                <div class="col-md-12">
                                    <label class="form-label fw-bold small text-muted text-uppercase">Body Temperature (°C)</label>
                                    <div class="input-group input-group-lg">
                                        <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-thermometer-half"></i></span>
                                        <input type="number" step="0.1" id="temperature" class="form-control border-start-0" placeholder="36.8" required>
                                    </div>
                                    <div class="form-text mt-2 small">Typical range: 36.1°C to 37.2°C</div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small text-muted text-uppercase">Pulse Rate (BPM)</label>
                                    <div class="input-group input-group-lg">
                                        <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-heart-pulse"></i></span>
                                        <input type="number" id="heartRate" class="form-control border-start-0" placeholder="72" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small text-muted text-uppercase">SpO2 Level (%)</label>
                                    <div class="input-group input-group-lg">
                                        <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-wind"></i></span>
                                        <input type="number" id="oxygenLevel" class="form-control border-start-0" placeholder="98" required>
                                    </div>
                                </div>
                                <div class="col-12 mt-5">
                                    <button type="submit" class="btn btn-primary w-100 btn-lg shadow-sm fw-bold">Commit Data to Platform</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="footer-placeholder"></div>

    <script src="js/auth.js?v=1.1"></script>
    <script>
        const user = checkAuth();
        document.getElementById('header-placeholder').innerHTML = getHeaderHTML('add');
        document.getElementById('footer-placeholder').innerHTML = getFooterHTML();

        async function saveHealthData(event) {
            event.preventDefault();
            const data = {
                temperature: document.getElementById('temperature').value,
                heartRate: document.getElementById('heartRate').value,
                oxygenLevel: document.getElementById('oxygenLevel').value
            };

            try {
                const response = await fetch(`/api/health/add/${user.id}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    notify('Cloud storage updated. Analysis complete.', 'success');
                    setTimeout(() => window.location.href = 'dashboard.html', 1500);
                }
            } catch (err) { notify('Platform error.', 'danger'); }
        }
    </script>
</body>
</html>
