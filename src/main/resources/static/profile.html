<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings - HealthGuard Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css?v=1.1">
</head>
<body style="padding-top: 72px">
    <div id="header-placeholder"></div>

    <div class="platform-layout">
        <aside class="sidebar d-none d-lg-flex">
            <nav>
                <a href="dashboard.html" class="sidebar-nav-link text-muted"><i class="fa-solid fa-home"></i> Overview</a>
                <a href="add_health_data.html" class="sidebar-nav-link text-muted"><i class="fa-solid fa-plus-circle"></i> Add Vitals</a>
                <a href="records.html" class="sidebar-nav-link text-muted"><i class="fa-solid fa-history"></i> History</a>
                <a href="alerts.html" class="sidebar-nav-link text-muted"><i class="fa-solid fa-bell"></i> Alerts</a>
                <hr>
                <a href="profile.html" class="sidebar-nav-link active"><i class="fa-solid fa-user-gear"></i> Settings</a>
            </nav>
        </aside>

        <main class="content-area">
            <div class="row">
                <div class="col-lg-12 mb-5">
                    <h1 class="fw-bold">Secured Profile Module</h1>
                    <p class="text-muted">Monitor your account activity and update your engineering credentials.</p>
                </div>

                <div class="col-lg-4 mb-4">
                    <div class="card p-4 text-center border-0 shadow-sm h-100 d-flex flex-column justify-content-center">
                        <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mx-auto mb-4 shadow-sm" style="width: 140px; height: 140px; font-size: 64px; font-weight: 700;">
                            <span id="profile-initial">U</span>
                        </div>
                        <h3 class="fw-bold mb-1" id="profile-name-header">User Name</h3>
                        <p class="text-muted small mb-3" id="profile-email-header">user@healthguard.com</p>
                        
                        <!-- High Performance Stats (As per Prompt) -->
                        <div class="bg-light rounded-4 p-3 mb-3 text-start">
                            <div class="d-flex justify-content-between mb-2">
                                <small class="text-muted fw-bold">TOTAL RECORDS:</small>
                                <span class="badge bg-primary px-2" id="stat-records">0</span>
                            </div>
                            <div class="d-flex justify-content-between">
                                <small class="text-muted fw-bold">HEALTH STATUS:</small>
                                <span class="badge bg-success px-2" id="stat-status">OPTIMAL</span>
                            </div>
                        </div>

                        <div class="mt-auto">
                            <span class="badge bg-success-subtle text-success border-success-subtle px-3 py-2 rounded-pill w-100">Identity Verified</span>
                        </div>
                    </div>
                </div>

                <div class="col-lg-8">
                    <div class="card p-5 border-0 shadow-sm mb-4">
                        <h5 class="fw-bold text-primary mb-4">Primary User Details</h5>
                        <form id="profile-form">
                            <div class="row g-4">
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-muted">Full Name</label>
                                    <input type="text" id="profile-name" class="form-control" value="">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-muted">Registered Email</label>
                                    <input type="email" id="profile-email" class="form-control bg-light" value="" readonly>
                                </div>
                                <div class="col-12 mt-5">
                                    <button type="submit" class="btn btn-primary px-5 fw-bold">Update Profile Information</button>
                                </div>
                            </div>
                        </form>
                    </div>

                    <div class="card p-5 border-0 shadow-sm">
                        <h5 class="fw-bold text-danger mb-4">Security: Change Password</h5>
                        <form id="password-form">
                            <div class="row g-4 align-items-end">
                                <div class="col-md-8">
                                    <label class="form-label small fw-bold text-muted">New Secure Password</label>
                                    <input type="password" id="new-password" class="form-control" placeholder="••••••••">
                                </div>
                                <div class="col-md-4">
                                    <button type="submit" class="btn btn-outline-danger w-100 fw-bold">Verify & Save</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="footer-placeholder"></div>

    <script src="js/auth.js?v=1.1"></script>
    <script>
        const user = checkAuth();
        document.getElementById('header-placeholder').innerHTML = getHeaderHTML();
        document.getElementById('footer-placeholder').innerHTML = getFooterHTML();

        async function loadProfileStats() {
            document.getElementById('profile-name-header').innerText = user.name;
            document.getElementById('profile-email-header').innerText = user.email;
            document.getElementById('profile-name').value = user.name;
            document.getElementById('profile-email').value = user.email;
            document.getElementById('profile-initial').innerText = user.name.charAt(0).toUpperCase();

            try {
                const res = await fetch(`/api/health/stats/${user.id}`);
                const stats = await res.json();
                document.getElementById('stat-records').innerText = stats.totalRecords;
                
                const histRes = await fetch(`/api/health/history/${user.id}`);
                const records = await histRes.json();
                if (records.length > 0) {
                    const r = records[0];
                    const isAbnormal = r.temperature > 38 || r.heartRate > 100 || r.oxygenLevel < 95;
                    const badge = document.getElementById('stat-status');
                    badge.innerText = isAbnormal ? 'ABNORMAL' : 'OPTIMAL';
                    badge.className = `badge px-2 ${isAbnormal ? 'bg-danger' : 'bg-success'}`;
                }
            } catch (err) { console.error(err); }
        }
        loadProfileStats();

        document.getElementById('profile-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('profile-name').value;
            await updateProfile('/api/user/update', { id: user.id, name: name }, 'PUT');
        });

        document.getElementById('password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pass = document.getElementById('new-password').value;
            if(!pass) return notify('Security context required', 'danger');
            await updateProfile('/api/user/change-password', { id: user.id, password: pass }, 'PUT');
        });

        async function updateProfile(url, payload, method = 'POST') {
            try {
                const res = await fetch(url, {
                    method: method,
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                if(res.ok) {
                    if (payload.name) {
                        const updatedUser = await res.json();
                        localStorage.setItem('user', JSON.stringify(updatedUser));
                    }
                    notify('Profile successfully synchronized.', 'success');
                    setTimeout(() => location.reload(), 1000);
                }
            } catch (err) { notify('Security layer error', 'danger'); }
        }
    </script>
</body>
</html>
