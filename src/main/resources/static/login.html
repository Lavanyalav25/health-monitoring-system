<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Health Monitoring System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css?v=1.1">
</head>
<body class="auth-bg">
    <!-- Bootstrap Flex Centering -->
    <div class="d-flex justify-content-center align-items-center vh-100 p-3">
        <div class="auth-card">
            <div class="logo-section text-center mb-4">
                <i class="fa-solid fa-house-chimney-medical"></i>
                <h2 class="fw-bold text-dark mb-1">HealthGuard</h2>
                <p class="text-muted small">Sign in to sync your vitals</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <!-- Floating Label Email -->
                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                    <label for="email"><i class="fa-solid fa-envelope me-2"></i>Email address</label>
                </div>

                <!-- Floating Label Password with Toggle -->
                <div class="password-container mb-2">
                    <div class="form-floating">
                        <input type="password" class="form-control" id="password" placeholder="Password" required>
                        <label for="password"><i class="fa-solid fa-lock me-2"></i>Password</label>
                    </div>
                    <i class="fa-solid fa-eye toggle-icon" id="togglePass" onclick="showPass('password', 'togglePass')"></i>
                </div>

                <div class="text-end mb-4">
                    <a href="#" class="link-primary small">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary w-100 shadow-sm">LOGIN</button>
            </form>

            <div class="mt-4 text-center">
                <p class="mb-0 text-muted small">Don't have an account? 
                    <a href="signup.html" class="link-primary">Sign Up Now</a>
                </p>
            </div>
        </div>
    </div>

    <script src="js/auth.js?v=1.1"></script>
    <script>
        function showPass(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === "password") {
                input.type = "text";
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = "password";
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            await login(email, pass);
        }
    </script>
</body>
</html>
