<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Warnings - HealthGuard Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css?v=1.1">
</head>
<body style="padding-top: 72px">
    <div id="header-placeholder"></div>

    <div class="platform-layout">
        <!-- Sidebar -->
        <aside class="sidebar d-none d-lg-flex">
            <div class="mb-5 px-3">
                <nav>
                    <a href="dashboard.html" class="sidebar-nav-link">
                        <i class="fa-solid fa-gauge-high"></i> Overview
                    </a>
                    <a href="add_health_data.html" class="sidebar-nav-link">
                        <i class="fa-solid fa-plus-circle"></i> Add Vitals
                    </a>
                    <a href="records.html" class="sidebar-nav-link">
                        <i class="fa-solid fa-history"></i> History
                    </a>
                    <a href="alerts.html" class="sidebar-nav-link active">
                        <i class="fa-solid fa-bell"></i> Alerts
                    </a>
                </nav>
            </div>
            <div class="mt-auto px-3">
                <nav>
                    <a href="profile.html" class="sidebar-nav-link">
                        <i class="fa-solid fa-user-circle"></i> Account
                    </a>
                    <a href="#" onclick="logout()" class="sidebar-nav-link text-danger">
                        <i class="fa-solid fa-sign-out-alt"></i> Sign Out
                    </a>
                </nav>
            </div>
        </aside>

        <!-- Content Area -->
        <main class="content-area">
            <div class="mb-5">
                <h1 class="fw-bold text-danger mb-1">Health Warning Alerts</h1>
                <p class="text-muted">Detected medical anomalies registered in your historical health data.</p>
            </div>
            
            <div id="alerts-list">
                <div class="text-center py-5"><div class="spinner-border text-danger"></div></div>
            </div>
        </main>
    </div>

    <div id="footer-placeholder"></div>

    <script src="js/auth.js?v=1.1"></script>
    <script>
        const user = checkAuth();
        document.getElementById('header-placeholder').innerHTML = getHeaderHTML('alerts');
        document.getElementById('footer-placeholder').innerHTML = getFooterHTML();

        async function loadAlerts() {
            try {
                const response = await fetch(`/api/health/alerts/${user.id}`);
                const alerts = await response.json();
                const container = document.getElementById('alerts-list');

                if (alerts.length === 0) {
                    container.innerHTML = `
                        <div class="card p-5 text-center border-0 shadow-sm bg-white">
                            <div class="display-1 text-success mb-4"><i class="fa-solid fa-circle-check"></i></div>
                            <h3 class="fw-bold text-success">All Clear</h3>
                            <p class="text-muted">You have no active health warnings. Your vitals are looking great!</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = alerts.map(a => {
                    const dateStr = a.createdAt ? new Date(a.createdAt).toLocaleString() : 'N/A';
                    const colorClass = a.status === 'Critical' ? 'danger' : 'warning';
                    return `
                    <div class="card mb-3 border-start border-${colorClass} border-5 shadow-sm">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h5 class="text-${colorClass} fw-bold mb-0">
                                    <i class="fa-solid fa-triangle-exclamation me-2"></i> ${a.type}
                                </h5>
                                <span class="text-muted small">${dateStr}</span>
                            </div>
                            <p class="mb-0 text-dark fw-500">${a.message}</p>
                            <div class="mt-3">
                                <span class="badge bg-${colorClass}-subtle text-${colorClass} border border-${colorClass}-subtle px-3 py-2">
                                    ${a.status} Intensity
                                </span>
                            </div>
                        </div>
                    </div>
                    `;
                }).join('');
            } catch (err) { notify('Database access issue.', 'danger'); }
        }
        loadAlerts();
    </script>
</body>
</html>
